name: Build iOS IPA

# 触发：推送到 master，或在 Actions 页点 "Run workflow" 手动触发
on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write # 把 IPA 发布成 Release 资源（浏览器免登录即可下载）

concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-ios:
    runs-on: macos-15
    timeout-minutes: 90
    env:
      LANG: en_US.UTF-8
      LC_ALL: en_US.UTF-8
      EXPO_NO_TELEMETRY: "1"
      # ↓↓↓ 在仓库 Settings → Secrets and variables → Actions → Variables 里配置 ↓↓↓
      TEAM_ID: ${{ vars.TEAM_ID }}          # 10 位 Apple Developer Team ID
      BUNDLE_ID: ${{ vars.BUNDLE_ID }}      # com.chenjingtao.techdocsai
      PROFILE_NAME: ${{ vars.PROFILE_NAME }}# Ad Hoc / Development 描述文件名称
      SIGN_METHOD: ${{ vars.SIGN_METHOD || 'ad-hoc' }}  # ad-hoc（默认）或 development
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install npm dependencies
        run: npm install --legacy-peer-deps

      # 生成原生 iOS 工程（不需要任何 Apple 凭证）
      - name: Generate native iOS project
        run: npx expo prebuild --platform ios --clean

      # 探测是否配了签名凭据：有 → 出【已签名 IPA】；没有 → 出【未签名 IPA】
      - name: Detect signing credentials
        id: signcheck
        env:
          CERT: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          PROFILE: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
        run: |
          if [ -n "$CERT" ] && [ -n "$PROFILE" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
            echo "==> 检测到签名凭据：将导出【已签名 IPA】"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "==> 未配置签名凭据：将导出【未签名 IPA】（可用 Sideloadly / AltStore / SideStore 以免费 Apple ID 自签安装）"
          fi

      # 把签名证书 + 描述文件灌进临时 keychain（仅在有凭据时执行）
      - name: Import signing certificate & provisioning profile
        if: steps.signcheck.outputs.available == 'true'
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode > /tmp/build_certificate.p12
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain-db
          security set-keychain-settings -lut 21600 build.keychain-db
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain-db
          security import /tmp/build_certificate.p12 -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k build.keychain-db
          security list-keychains -d user -s build.keychain-db login.keychain-db
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" build.keychain-db
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          echo -n "$BUILD_PROVISION_PROFILE_BASE64" | base64 --decode > "$HOME/Library/MobileDevice/Provisioning Profiles/profile.mobileprovision"

      # 先打一个【不签名】的 archive —— 两条路径共用
      - name: Build archive
        run: |
          cd "$GITHUB_WORKSPACE/ios"
          WORKSPACE=$(find . -maxdepth 1 -name "*.xcworkspace" | head -1)
          if [ -z "$WORKSPACE" ]; then echo "ERROR: no .xcworkspace (pod install may have failed)"; ls -la; exit 1; fi
          # 自动探测 scheme：Expo 会把 CJK 应用名清洗为 ASCII（如 技术资料AI助手 -> AI），不再用 basename 假设
          SCHEME=$(xcodebuild -list -workspace "$WORKSPACE" 2>/dev/null | awk '/Schemes:/{f=1;next} f&&NF{print $1; exit}')
          if [ -z "$SCHEME" ]; then echo "ERROR: could not detect scheme"; xcodebuild -list -workspace "$WORKSPACE"; exit 1; fi
          echo "WORKSPACE=$WORKSPACE  SCHEME=$SCHEME"
          xcodebuild -workspace "$WORKSPACE" -scheme "$SCHEME" \
            -configuration Release clean archive \
            -archivePath "$RUNNER_TEMP/build.xcarchive" CODE_SIGNING_ALLOWED=NO

      # 路径 A：有凭据 → 已签名 IPA
      - name: Export signed IPA
        if: steps.signcheck.outputs.available == 'true'
        run: |
          cd "$GITHUB_WORKSPACE"
          python3 scripts/make-export-options.py
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/build.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" -exportOptionsPlist exportOptions.plist
          ls -lh "$RUNNER_TEMP/export"

      # 路径 B：无凭据 → 未签名 IPA（把 .app 装进 Payload/ 再 zip）
      - name: Package unsigned IPA
        if: steps.signcheck.outputs.available != 'true'
        run: |
          ARCHIVE="$RUNNER_TEMP/build.xcarchive"
          EXPORT="$RUNNER_TEMP/export"
          APP=$(find "$ARCHIVE/Products/Applications" -maxdepth 1 -name "*.app" | head -1)
          if [ -z "$APP" ]; then echo "ERROR: .app not found in archive"; ls -R "$ARCHIVE/Products" | head -60; exit 1; fi
          echo "APP=$APP"
          rm -rf "$EXPORT"; mkdir -p "$EXPORT/Payload"
          cp -R "$APP" "$EXPORT/Payload/"
          cd "$EXPORT"
          zip -qry techdocs-ai-unsigned.ipa Payload
          ls -lh *.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: techdocs-ai-ipa
          path: ${{ runner.temp }}/export/*.ipa
          if-no-files-found: error

      # 额外发一个 Release 并附上 IPA → 浏览器免登录可直接下载
      - name: Publish IPA as Release asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          IPA=$(find "$RUNNER_TEMP/export" -maxdepth 1 -name "*.ipa" | head -1)
          if [ -z "$IPA" ]; then echo "no ipa found, skip release"; exit 0; fi
          KIND="unsigned"
          if [ "${{ steps.signcheck.outputs.available }}" = "true" ]; then KIND="signed"; fi
          TAG="build-${{ github.run_number }}"
          echo "release tag=$TAG kind=$KIND ipa=$IPA"
          gh release create "$TAG" \
            --repo "${{ github.repository }}" \
            --title "iOS 构建 #${{ github.run_number }} ($KIND)" \
            --notes "类型: $KIND / 提交: ${{ github.sha }} / 运行: #${{ github.run_number }}" \
            --prerelease "$IPA" \
            || gh release upload "$TAG" "$IPA" --clobber
